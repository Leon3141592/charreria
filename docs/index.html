<!DOCTYPE html>
<html lang="es">
<head>

<title>Charrería Pro</title>

<style>
:root{--bg:#0e0a08;--bg2:#15100c;--card:#1c1510;--card2:#251b14;--line:#3a2b20;--line2:#4d3a2b;--gold:#d9a84e;--gold2:#f2cd7e;--vino:#8e1b2c;--vino2:#b02a3e;--red:#ef4444;--green:#3fb37f;--blue:#5b9bd5;--text:#f4ece1;--mut:#a8988a;--mut2:#76685c;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));min-height:100vh;background:radial-gradient(1200px 500px at 50% -200px,rgba(142,27,44,.28),transparent 70%),var(--bg)}
a{color:var(--gold2)}button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(14,10,8,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);flex:1;min-width:0}
.brand b{font-family:'Cinzel',serif;font-size:19px;font-weight:800;letter-spacing:.03em;white-space:nowrap}.brand b span{color:var(--gold)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--vino2),#4a0d17);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(242,205,126,.35);flex:none}
.logo svg{width:20px;height:20px;color:var(--gold2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--gold2);text-decoration:none;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 24px}
.wrap.wide{max-width:900px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(21,16,12,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mut2);text-decoration:none;padding:6px 0 4px;border-radius:12px;position:relative}
.nav a.on{color:var(--gold2)}.nav a.on::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
.nav svg{width:23px;height:23px}
.nav .dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg2);animation:pulse 1.6s infinite}
svg{flex:none}h1,h2,h3{margin:0}
.h1{font-family:'Cinzel',serif;font-size:24px;font-weight:800;line-height:1.15}
.h2{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
.h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}.h2 a{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;order:3}
.sub{color:var(--mut);font-size:13.5px}.mut{color:var(--mut)}.mut2{color:var(--mut2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.card+.card{margin-top:10px}
.list>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.live{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.45);color:#ff8a8a}.chip.live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
.chip.gold{background:rgba(217,168,78,.12);border-color:rgba(217,168,78,.45);color:var(--gold2)}
.chip.green{background:rgba(63,179,127,.12);border-color:rgba(63,179,127,.45);color:#7fdcb0}
.chip.blue{background:rgba(91,155,213,.12);border-color:rgba(91,155,213,.45);color:#9cc5ee}
.chip.red{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#ff9a9a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:12px 16px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;background:var(--card2);color:var(--text);border:1px solid var(--line2);min-height:46px}
.btn svg{width:18px;height:18px}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1a08;border-color:transparent}
.btn.vino{background:linear-gradient(180deg,var(--vino2),var(--vino));color:#fff;border-color:transparent}
.btn.live{background:linear-gradient(180deg,#f25555,#c92a2a);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:11px}.btn.block{width:100%}.btn:disabled{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>.btn{flex:1}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
.in:focus{border-color:var(--gold)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.in{min-height:64px;resize:vertical}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--line2)}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}.scroller>*{flex:none}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.tog{border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mut);text-align:left}
.tog.on{background:rgba(217,168,78,.14);border-color:var(--gold);color:var(--gold2)}
.tog.done{border-color:rgba(63,179,127,.55);color:#9fe3c3}
.tog.done.on{background:rgba(63,179,127,.16);color:#b8f0d4;border-color:var(--green)}
.tog b{font-weight:800}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;border:1px solid rgba(239,68,68,.35);background:radial-gradient(400px 200px at 100% 0,rgba(239,68,68,.22),transparent 70%),linear-gradient(160deg,#2a1510,#160e0b)}
.hero .score-big{font-family:'Cinzel',serif;font-size:40px;font-weight:800;color:var(--gold2);line-height:1}
.pattern{position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 14px,var(--vino2) 14px 24px,transparent 24px 28px);opacity:.55}
.evc{display:block;text-decoration:none;color:inherit}.evc .t{font-weight:800;font-size:15.5px;line-height:1.25}.evc .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.datebox{width:48px;text-align:center;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);padding:6px 0;flex:none}
.datebox b{display:block;font-family:'Cinzel',serif;font-size:19px;color:var(--gold2);line-height:1}.datebox span{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.rank{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line)}.rank:last-child{border-bottom:0}
.pos{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg2);color:var(--mut);border:1px solid var(--line2);flex:none}
.pos.p1{background:linear-gradient(160deg,#f7d98c,#c8902e);color:#2a1a08;border:0}.pos.p2{background:linear-gradient(160deg,#e4e4e4,#9a9a9a);color:#1d1d1d;border:0}.pos.p3{background:linear-gradient(160deg,#e0a072,#9b5a2e);color:#25140a;border:0}
.pts{font-family:'Cinzel',serif;font-weight:800;font-size:19px;color:var(--gold2);text-align:right;line-height:1}.pts small{display:block;font-family:'Plus Jakarta Sans';font-size:10.5px;font-weight:600;color:var(--mut2);margin-top:3px}
.pad0{padding:0;overflow:hidden}
.bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vino2),var(--gold))}
.feed .it{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.feed .it:last-child{border-bottom:0}
.feed .num{min-width:54px;text-align:center;border-radius:12px;padding:8px 4px;background:var(--bg2);border:1px solid var(--line2)}
.feed .num b{display:block;font-family:'Cinzel',serif;font-size:22px;color:var(--gold2);line-height:1}.feed .num span{font-size:9.5px;color:var(--mut2);font-weight:700;letter-spacing:.06em}
.flash{animation:flash 2.2s ease-out}@keyframes flash{0%{background:rgba(242,205,126,.28)}100%{background:transparent}}
.video{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;border:1px solid var(--line)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--mut);background:repeating-linear-gradient(135deg,#140e0b 0 14px,#18110d 14px 28px)}
.video .ph svg{width:34px;height:34px;color:var(--mut2);margin:0 auto 6px;display:block}
.empty{text-align:center;padding:28px 16px;color:var(--mut)}.empty svg{width:40px;height:40px;color:var(--mut2);margin-bottom:8px}
.banner{font-size:12.5px;border-radius:12px;padding:10px 12px;background:rgba(91,155,213,.1);border:1px solid rgba(91,155,213,.35);color:#bcd8f3;display:flex;gap:8px;align-items:flex-start}
.banner svg{width:16px;height:16px;margin-top:1px}
.banner.warn{background:rgba(217,168,78,.1);border-color:rgba(217,168,78,.4);color:var(--gold2)}.banner.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#ffb0b0}
.banner.ok{background:rgba(63,179,127,.1);border-color:rgba(63,179,127,.4);color:#a6ecc9}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px}.kpi b{display:block;font-family:'Cinzel',serif;font-size:24px;color:var(--gold2);line-height:1}.kpi span{font-size:11px;color:var(--mut);font-weight:600}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);font-size:20px;font-weight:700;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font-size:18px}
.toasts{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#2b211a;border:1px solid var(--line2);color:var(--text);padding:11px 16px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .25s ease-out;max-width:520px}
.toast.ok{border-color:rgba(63,179,127,.6)}.toast.err{border-color:rgba(239,68,68,.6)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal .box{width:100%;max-width:540px;max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:18px;margin-bottom:env(safe-area-inset-bottom);animation:tin .2s ease-out}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;font-size:13.5px;font-weight:600;margin-bottom:10px}.back svg{width:16px;height:16px}
.team{border:1px solid var(--line2);border-radius:14px;padding:12px;background:var(--bg2);margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);font-size:13px;margin:6px 6px 0 0}
.tag button{width:22px;height:22px;border-radius:50%;border:0;background:var(--line);color:var(--mut);cursor:pointer;display:grid;place-items:center;padding:0}.tag button svg{width:12px;height:12px}
.tag.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#ffc2c2}
.ic{width:18px;height:18px}
.badge-n{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.verified{display:inline-flex;vertical-align:-2px;color:var(--gold2)}.verified svg{width:15px;height:15px}
.sep{height:1px;background:var(--line);margin:14px 0}
.small{font-size:12.5px}.center{text-align:center}.mt{margin-top:12px}.mt2{margin-top:20px}
.marrow{display:grid;place-items:center;transform:rotate(180deg);color:var(--mut2)}.marrow svg{width:20px;height:20px}
.footer{text-align:center;color:var(--mut2);font-size:11.5px;margin-top:28px}
/* Mesa del juez */
.opp{border:1px solid var(--line2);border-radius:14px;background:var(--bg2);padding:12px;margin-top:10px}
.opp.dq{border-color:rgba(239,68,68,.55)}
.opp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.score-line{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700}
.score-line .b{color:#7fdcb0}.score-line .m{color:#ff9a9a}.score-line .t{color:var(--gold2);font-family:'Cinzel',serif;font-size:18px}
.mini-l{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);margin:12px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-bar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:10;margin-top:14px;background:rgba(28,21,16,.97);border:1px solid var(--gold);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.sum-bar .big{font-family:'Cinzel',serif;font-size:30px;font-weight:800;color:var(--gold2);line-height:1}
/* Hoja oficial */
.sheet-wrap{overflow:auto;margin:0 -16px;padding:0 16px 10px}
.sheet{width:800px;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:10px;padding:18px 18px 22px;border-radius:6px;margin:0 auto}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #222;padding:2px 3px;text-align:center;vertical-align:middle;height:20px;overflow:hidden}
.sheet th{font-size:8.5px;font-weight:700}
.sheet .fn{font-size:13px;font-weight:800;background:#e3e3e3;text-align:center;letter-spacing:.02em}
.sheet .who{text-align:left;font-size:10px;font-weight:600}
.sheet .red{color:#c00}.sheet .g{background:#e3e3e3;font-weight:700}
.sheet .gt{background:#e3e3e3;font-weight:800;font-size:11px}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.sheet .ttl{font-size:17px;font-weight:800;color:#1f6b2d;letter-spacing:.04em}
.sheet .stl{font-size:9.5px;color:#444;margin-top:2px}
.sheet .flds{display:grid;grid-template-columns:2.2fr 1fr;gap:3px 14px;font-size:11px;font-weight:700;margin-top:8px}
.sheet .flds span{display:flex;gap:6px}.sheet .flds em{flex:1;font-style:normal;font-weight:400;border-bottom:1px solid #222;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .blk{margin-top:9px;break-inside:avoid}
.sheet .aux{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:3px;font-size:10px;font-weight:700}
.sheet .box{display:inline-block;min-width:54px;border:1.5px solid #222;padding:2px 6px;text-align:center;font-weight:800}
.sheet .det{font-size:8.5px;color:#333;text-align:left;margin-top:2px;line-height:1.35}
.sheet .tot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.sheet .tot .box{font-size:14px;min-width:90px;padding:6px 10px}
.sheet .firmas{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;font-size:10px;font-weight:800;text-align:center}
.sheet .firmas div{border:1px solid #222;border-top:0;height:42px;display:flex;flex-direction:column;justify-content:flex-end;padding:3px;font-weight:600;font-size:9px}
.sheet .firmas b{border:0;display:block;padding-bottom:3px}
.sheet .foot{margin-top:12px;font-size:8.5px;color:#555;display:flex;justify-content:space-between;gap:10px}
.sheet .stamp{color:#1f6b2d;font-weight:800}
@media print{
  body{background:#fff!important;padding:0}
  .top,.nav,.noprint,.toasts,#modal{display:none!important}
  .wrap{max-width:none;padding:0}.sheet-wrap{overflow:visible;margin:0;padding:0}
  .sheet{zoom:1!important;width:100%;border-radius:0;padding:0}
  @page{size:letter portrait;margin:8mm}
}
</style>

<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="view"></main>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div class="toasts" id="toasts"></div>
<div id="modal"></div>
<script>
/* =====================================================================
   MOTOR DE CALIFICACIÓN — Reglamento Oficial de Charros Libre y Juvenil
   2024-2028. Cada valor viene del reglamento (artículo / fracción).
   ===================================================================== */
const RULES = (() => {
  // ---------- Sanciones generales (Cap. XI) ----------
  const GEN = [
    ['gI','Montura sucia, retobo roto o sin chapetones',1],['gII','Montura con fuste quebrado',2],
    ['gIII','Jinete pierde o se le sale arreo, atuendo o chaleco',1],['gV','No traer o perder la cuarta (arreador)',2],
    ['gVI','Sogas de material no permitido o sin lazada (arreador)',2],['gVII','Falta de tientos o menores a 5 cm',2],
    ['gVIII','Pantalón roto o se pierde/desabrocha parte del atuendo',2],['gIX','Falta de baberillos en el freno',4],
    ['gX','Quitarse el sombrero durante la faena',2],['gXI','Voltear o soltar los estribos',2],
    ['gXII','Hacer sangrar la cabalgadura',2],['gXIII','Reclamar calificación sin ser capitán',5],
    ['gXIV','Irse la montura de lado',2],['gXV','Apoyarse de la cabeza de la montura o cabalgadura',2],
    ['gXVI','Perder el tiempo injustificadamente',2],['gXVIII','Crin o cola amarrada o trenzada',4],
    ['gXIX','Golpear la cabalgadura en la cabeza',4],['gXXI','Caerse o desmontarse sin autorización',6],
    ['gXXIII','Camisa mal fajada o mangas arremangadas',1],['gXXIV','Usar puya eléctrica en el ruedo',4],
    ['gXXV','Falta de atuendo o arreos (arreador)',2],['gXXVIII','Cadenilla con vuelta en el freno',2],
    ['gXXIX','Tratar de sorprender al jurado',5],['gXXX','Calentar cabalgaduras durante las faenas',2]

  mode: 'demo', bc: ('BroadcastChannel' in window) ? new BroadcastChannel('charreriapro') : null,
  async init(){
    let raw = null; try { raw = localStorage.getItem(LS_KEY); } catch(e){}
    try { DB.data = raw ? JSON.parse(raw) : seed(); } catch(e){ DB.data = seed(); }
    TABLES.forEach(t => DB.data[t] = DB.data[t] || []);
    if (!raw) this.persist();
    if (this.bc) this.bc.onmessage = () => this.reload();
    window.addEventListener('storage', e => { if (e.key === LS_KEY) this.reload(); });
  },
  reload(){ try { const r = localStorage.getItem(LS_KEY); if (r) DB.data = JSON.parse(r); } catch(e){} onRemoteChange(); },
  persist(){ try { localStorage.setItem(LS_KEY, JSON.stringify(DB.data)); } catch(e){} },
  async put(){ this.persist(); if (this.bc) this.bc.postMessage('sync'); },
  sessionGet(){ try { return localStorage.getItem(SS_KEY); } catch(e){ return memSession; } },
  sessionSet(v){ memSession = v; try { v ? localStorage.setItem(SS_KEY, v) : localStorage.removeItem(SS_KEY); } catch(e){} },
  async restore(){ const id = this.sessionGet(); return id ? DB.get('profiles', id) || null : null; },
  async login(email, pass){
    const p = DB.all('profiles').find(x => norm(x.email) === norm(email));
    if (!p || p.passHash !== demoHash(pass)) throw new Error('Correo o contraseña incorrectos');
    this.sessionSet(p.id); return p;
  },
  async register(payload, pass){
    if (DB.all('profiles').some(x => norm(x.email) === norm(payload.email))) throw new Error('Ese correo ya está registrado');
    const id = 'u' + uid(); const prof = await createAccount(id, payload, { passHash: demoHash(pass) });
    this.sessionSet(id); return { profile: prof };
  },
  async logout(){ this.sessionSet(null); },
  async uploadVideo(file){ return URL.createObjectURL(file); },
  async reset(){ try { localStorage.removeItem(LS_KEY); localStorage.removeItem(SS_KEY); } catch(e){} DB.data = seed(); this.persist(); }
};
const Remote = {
  mode: 'supabase', sb: null,
  async init(){
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const errs = await this.refetch();
    if (errs.length === TABLES.length) throw new Error(errs[0].message || 'Sin respuesta del servidor');
    this.sb.channel('charreriapro-all').on('postgres_changes', { event: '*', schema: 'public' }, p => {
      const t = p.table; if (!TABLES.includes(t)) return;
      const arr = DB.data[t] || (DB.data[t] = []);
      if (p.eventType === 'DELETE') DB.data[t] = arr.filter(r => r.id !== p.old.id);
      else { const row = p.new.data; const i = arr.findIndex(r => r.id === row.id); if (i >= 0) arr[i] = row; else arr.push(row); }
      onRemoteChange();
    }).subscribe();
  },
  async refetch(){ const errs = []; await Promise.all(TABLES.map(async t => { const { data, error } = await this.sb.from(t).select('id,data').limit(20000); if (error) errs.push(error); DB.data[t] = error ? [] : data.map(r => r.data); })); return errs; },
  async put(t, row){ const { error } = await this.sb.from(t).upsert({ id: row.id, data: row }); if (error) throw new Error(error.message.includes('row-level security') ? 'No tienes permiso para esta acción' : error.message); },
  async ensureProfile(user){
    let p = DB.get('profiles', user.id);
    if (!p && user.user_metadata && user.user_metadata.pending) { await createAccount(user.id, user.user_metadata.pending, {}); await this.refetch(); p = DB.get('profiles', user.id); }
    return p || null;
  },
  async restore(){ const { data } = await this.sb.auth.getSession(); return data.session ? this.ensureProfile(data.session.user) : null; },
  async login(email, pass){
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw new Error(error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos' : error.message);
    await this.refetch(); const p = await this.ensureProfile(data.user);
    if (!p) throw new Error('Tu cuenta no tiene perfil. Contacta al administrador.'); return p;
  },
  async register(payload, pass){
    const { data, error } = await this.sb.auth.signUp({ email: payload.email, password: pass, options: { data: { pending: payload } } });
    if (error) throw new Error(error.message);
    if (!data.session) return { needsConfirm: true };
    await this.refetch(); return { profile: await this.ensureProfile(data.user) };
  },
  async logout(){ await this.sb.auth.signOut(); await this.refetch(); },
  async uploadVideo(file, eventId){
    const path = `${eventId}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;
    const { error } = await this.sb.storage.from('videos').upload(path, file, { upsert: false });
    if (error) throw new Error(error.message);
    return this.sb.storage.from('videos').getPublicUrl(path).data.publicUrl;
  }
};
async function createAccount(id, pl, extra){
  let status = 'pendiente', lienzoId = pl.lienzoId || null; const role = pl.role; let inv = null;
  if (pl.invite) {
    inv = DB.get('invites', pl.invite);
    if (DB.backend.mode === 'demo' && (!inv || inv.used || inv.role !== role)) throw new Error('Código de invitación inválido o ya usado');
    status = 'aprobado'; if (inv && inv.lienzoId) lienzoId = inv.lienzoId;
  }
  if (role === 'lienzo') lienzoId = 'l' + uid();
  const prof = { id, name: pl.name, email: pl.email, phone: pl.phone || '', role, status, lienzoId, invite: pl.invite || null, createdAt: Date.now(), ...extra };
  await DB.put('profiles', prof);
  if (role === 'lienzo') await DB.put('lienzos', { id: lienzoId, name: pl.lienzoName, city: pl.city, state: pl.state, ownerId: id, status, createdAt: Date.now() });
  if (inv && DB.backend.mode === 'demo') await DB.put('invites', { ...inv, used: true, usedBy: id, usedAt: Date.now() });
  await audit('registro', `${pl.name} se registró como ${roleName(role)}${pl.invite ? ' con invitación ' + pl.invite : ''}`, id, pl.name);
  return prof;
}

/* ------------------------- GENERADOR DE CALIFICACIONES (demo) ------------------------- */
function genFaena(fk, ev, team, rng){
  const ch = ev.charros.filter(c => c.teamId === team.id); const P = i => ch.length ? ch[i % ch.length].id : '';
  const R = RULES, pick = l => l[Math.floor(rng() * l.length)][0], some = (l, p) => l.filter(() => rng() < p).map(x => x[0]);
  const malos = (defs, p = .35) => rng() < p ? [{ c: defs[Math.floor(rng() * Math.min(defs.length, 14))][0], n: 1 }] : [];
  const d = R.blank(fk, ev.mode);
  const cc = ev.mode === 'completo';
  switch (fk) {
    case 'cala': Object.assign(d, { who: P(0), metros: (5 + rng() * 6).toFixed(2), tiempos: String(1 + Math.floor(rng() * 5)), ld6: rng() > .35, ldPata: rng() > .6, li6: rng() > .4, liPata: rng() > .65, md: Math.floor(rng() * 3), mi: Math.floor(rng() * 3), pc: rng() > .5, m: malos(R.CALA_INF, .6), dq: rng() < .05 }); break;
    case 'piales': { d.who = P(cc ? 0 : 1); const used = []; d.tiros = d.tiros.map(o => { const r = rng() < .62 ? pick(R.PIAL_REM.filter(x => !used.includes(x[0]))) : ''; if (r) used.push(r); return { ...o, res: r, dist: r && rng() > .6 ? 1 + Math.floor(rng() * 3) : '', ex: r ? some(R.PIAL_EX, .35) : [], m: malos(R.F.piales.inf, .25) }; }); break; }
    case 'coleadero': d.coleadores = d.coleadores.map((c, i) => ({ who: P(cc ? 0 : 2 + i), pasadas: c.pasadas.map(o => { const r = rng() < .68 ? pick(R.CAIDAS) : ''; return { ...o, res: r, dist: r ? pick([...R.COLA_DIST, ['', '', 0]]) : '', ex: r ? some(R.COLA_EX, .15) : [], m: malos(R.F.coleadero.inf, .3) }; }) })); break;
    case 'toro': case 'yegua': { const cls = ['exc','buena','buena','reg','reg','mreg','min'][Math.floor(rng() * 7)]; const cols = fk === 'toro' ? R.TORO_COLS : R.YEGUA_COLS;
      Object.assign(d, { who: P(cc ? 0 : (fk === 'toro' ? 5 : 3)), cls, ad: some(cols, .22), desc: rng() < .3, tiempo: (0.6 + rng() * 3.2).toFixed(1), m: malos(R.F[fk].inf, .3), dq: rng() < .08 }); break; }
    case 'terna': { d.lazadores = [P(0), P(1), P(2)]; let cab = false, pi = false, n = 0;
      while (n < 5 && !(cab && pi)) { const tipo = cab ? 'pial' : 'cabeza'; const ok = rng() < (cab ? .45 : .55);
        const res = ok ? pick(tipo === 'pial' ? R.PIAL_RUEDO : R.CABEZA) : '';
        d.intentos.push({ l: n % 3, tipo, res, fl: res === 'floreado' ? some(R.FLOREO_TERNA.slice(0, 9), .3) : [], rm: res ? some(tipo === 'pial' ? R.REM_PIAL.slice(8) : R.REM_CABEZA, .25) : [], m: malos(tipo === 'pial' ? R.TERNA_INF_PIAL : R.TERNA_INF_CAB, .2) });
        if (ok && tipo === 'cabeza') cab = true; if (ok && tipo === 'pial') pi = true; n++; }
      d.tiempo = cab && pi ? (2 + rng() * 5).toFixed(1) : ''; break; }
    case 'mpie': case 'mcab': { d.who = P(cc ? 0 : (fk === 'mpie' ? 4 : 5)); const REM = fk === 'mpie' ? R.MPIE_REM : R.MCAB_REM, FL = fk === 'mpie' ? R.MPIE_FL : R.MCAB_FL; const used = [];
      d.tiros = d.tiros.map(o => { const r = rng() < .55 ? pick(REM.filter(x => !used.includes(x[0]))) : ''; if (r) used.push(r);
        return { ...o, res: r, fl: r ? some(FL, .25) : [], es: fk === 'mpie' && r ? some(R.MPIE_ES.slice(0, 2), .3) : [], m: malos(R.F[fk].inf, .3) }; });
      d.tiempo = (3 + rng() * 4).toFixed(1); break; }
    case 'paso': { const v = rng(); Object.assign(d, { who: P(cc ? 0 : 1), vuelta: v < .45 ? '1' : v < .7 ? '2' : '', cuarto: String(1 + Math.floor(rng() * 3)), cls: pick(R.PASO_CLS), arreo: rng() < .7 ? 'sin' : 'con', cuartear: rng() > .5, apearse: rng() > .6, desc: rng() < .25, m: malos(R.F.paso.inf, .25) }); break; }
  }
  if (rng() < .12) d.eq = [{ c: RULES.F[fk].eq[0][0], n: 1 }];
  return d;
}
function scoreRow(ev, team, fk, d, judge, ts){
  const r = RULES.calc(fk, d), name = id => (ev.charros.find(c => c.id === id) || {}).name || '';
  return { id: `${ev.id}-${team.id}-${fk}`, eventId: ev.id, teamId: team.id, teamName: team.name, faena: fk, input: d,
    buenos: r.buenos, malos: r.malos, total: r.total, eq: r.eq, net: r.total - r.eq,
    parts: r.parts.map(p => ({ ...p, name: name(p.id) })), judgeId: judge[0], judgeName: judge[1], createdAt: ts, updatedAt: ts };
}

/* ------------------------- LÓGICA ------------------------- */
const roleName = r => ({ superadmin:'Súper usuario', lienzo:'Lienzo', juez:'Juez' }[r] || r);
const lienzo = id => DB.get('lienzos', id) || { name:'Lienzo', state:'', city:'' };
const isApproved = u => u && u.status === 'aprobado';
const isSuper = u => u && u.role === 'superadmin' && isApproved(u);
const myLienzo = u => u && u.role === 'lienzo' ? DB.get('lienzos', u.lienzoId) : null;
const ownsLienzo = (u, lid) => isApproved(u) && u.role === 'lienzo' && u.lienzoId === lid && lienzo(lid).status === 'aprobado';
const isJudgeOf = (u, lid) => isApproved(u) && u.role === 'juez' && u.lienzoId === lid;
const canManage = (u, ev) => isSuper(u) || ownsLienzo(u, ev.lienzoId);
const canScore = (u, ev) => ev && ev.status === 'en_vivo' && (isSuper(u) || ownsLienzo(u, ev.lienzoId) || isJudgeOf(u, ev.lienzoId));
const canSheet = (u, ev) => ev && ['en_vivo','finalizado'].includes(ev.status) && (isSuper(u) || ownsLienzo(u, ev.lienzoId) || isJudgeOf(u, ev.lienzoId));
const publicEvents = () => DB.all('events').filter(e => e.status !== 'borrador' && lienzo(e.lienzoId).status === 'aprobado');
const evScores = id => DB.all('scores').filter(s => s.eventId === id);
const sheetOf = (eid, tid) => DB.get('sheets', `${eid}-${tid}`);
const isLocked = (ev, tid) => { const sh = sheetOf(ev.id, tid); return !!(sh && sh.entregada); };
const teamLabel = ev => ev.mode === 'completo' ? 'Charro' : 'Equipo';
function teamStandings(ev){
  const sc = evScores(ev.id);
  return ev.teams.map(t => { const ts = sc.filter(s => s.teamId === t.id); return { ...t, pts: sum(ts.map(s => s.net)), malos: sum(ts.map(s => s.malos + s.eq)), n: ts.length }; })
    .sort((a, b) => b.pts - a.pts || a.malos - b.malos);
}
function charroStandings(ev){
  const m = {};
  evScores(ev.id).forEach(s => s.parts.forEach(p => { const r = m[p.id] = m[p.id] || { name: p.name, team: s.teamName, pts: 0, n: 0, f: [] }; r.pts += p.pts; r.n++; r.f.push(RULES.F[s.faena].short); }));
  return Object.values(m).sort((a, b) => b.pts - a.pts);
}
async function audit(action, detail, actorId, actorName){

}

function eventCard(ev){

function embed(url){
  if (!url) return ''; let m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/))) return `<iframe src="https://www.youtube.com/embed/${m[1]}?playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  if (/facebook\.com|fb\.watch/.test(url)) return `<iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  if (/\.(mp4|webm|mov|m4v)(\?|$)/i.test(url) || url.startsWith('blob:') || url.includes('/storage/v1/object/')) return `<video src="${esc(url)}" controls playsinline preload="metadata"></video>`;

}

/* ---------- HISTORIAL ---------- */
function vHistorial(){
  const q = norm(State.histQ);
  let evs = publicEvents().filter(e => e.status === 'finalizado');
  if (State.histOficial) evs = evs.filter(e => e.official);
  if (State.histEstado) evs = evs.filter(e => lienzo(e.lienzoId).state === State.histEstado);
  if (q) evs = evs.filter(e => norm(e.title + ' ' + lienzo(e.lienzoId).name + ' ' + e.teams.map(t => t.name).join(' ') + ' ' + e.charros.map(c => c.name).join(' ')).includes(q));
  evs.sort((a, b) => b.date.localeCompare(a.date));
  const groups = {}; evs.forEach(e => { const [y, m] = e.date.split('-'); const k = `${MESES_L[+m - 1]} ${y}`; (groups[k] = groups[k] || []).push(e); });
  const estados = [...new Set(publicEvents().map(e => lienzo(e.lienzoId).state))].sort();
  let h = `<div class="h1">Historial</div><div class="sub" style="margin-top:4px">Charreadas pasadas con sus calificaciones y hojas.</div>
    <div class="mt" style="position:relative"><span style="position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--mut2)">${I.search}</span><input class="in" style="padding-left:40px" placeholder="Buscar charro, equipo, lienzo…" value="${esc(State.histQ)}" data-model="histQ"></div>
    <div class="row mt" style="gap:8px"><select class="in" data-model="histEstado" style="flex:1"><option value="">Todos los estados</option>${estados.map(s => `<option ${s === State.histEstado ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <button class="tog ${State.histOficial ? 'on' : ''}" data-act="histOficial" style="white-space:nowrap">Solo oficiales</button></div>`;
  if (!evs.length) return h + `<div class="mt">${emptyState(I.search, 'Sin resultados', 'Prueba con otra búsqueda o filtro.')}</div>`;
  Object.entries(groups).forEach(([k, list]) => { h += `<div class="h2">${k}</div><div class="list">${list.map(eventCard).join('')}</div>`; });
  return h;
}

/* ---------- RANKING ---------- */
const rankingEvents = ({ year, oficial, estado, mode }) => publicEvents().filter(e => e.status === 'finalizado' && (!oficial || e.official) && (!year || e.date.startsWith(year)) && (!estado || lienzo(e.lienzoId).state === estado) && (!mode || (e.mode || 'equipos') === mode));
function rankingCharros(opt){
  const ids = new Set(rankingEvents(opt).map(e => e.id)), m = {};
  DB.all('scores').filter(s => ids.has(s.eventId) && (!opt.suerte || s.faena === opt.suerte)).forEach(s => s.parts.forEach(p => {
    const k = norm(p.name); const r = m[k] = m[k] || { name: p.name, team: s.teamName, pts: 0, n: 0, best: -99, evs: new Set() };
    r.pts += p.pts; r.n++; r.best = Math.max(r.best, p.pts); r.evs.add(s.eventId); r.team = s.teamName;
  }));
  return Object.values(m).sort((a, b) => b.pts - a.pts || b.best - a.best);
}
function rankingEquipos(opt, mode){
  const m = {};
  rankingEvents({ ...opt, mode }).forEach(ev => teamStandings(ev).forEach((t, i) => {
    const pts = opt.suerte ? sum(evScores(ev.id).filter(s => s.teamId === t.id && s.faena === opt.suerte).map(s => s.net)) : t.pts;
    const k = norm(t.name); const r = m[k] = m[k] || { name: t.name, state: t.assoc || t.state, pts: 0, wins: 0, evs: 0, best: -99 };
    r.pts += pts; r.evs++; r.best = Math.max(r.best, pts); if (i === 0 && !opt.suerte && t.n) r.wins++;
  }));
  return Object.values(m).sort((a, b) => b.pts - a.pts);
}
function vRanking(){
  const years = [...new Set(publicEvents().map(e => e.date.slice(0, 4)))].sort().reverse(), estados = [...new Set(publicEvents().map(e => lienzo(e.lienzoId).state))].sort();
  const opt = { year: State.rankYear, oficial: State.rankOficial, suerte: State.rankSuerte, estado: State.rankEstado };
  let h = `<div class="h1">Ranking nacional</div><div class="sub" style="margin-top:4px">Puntos netos (buenos menos malos) en charreadas ${State.rankOficial ? 'oficiales ' : ''}finalizadas.</div>
    <div class="seg mt">${[['charros','Charros'],['equipos','Equipos'],['completo','Charro completo']].map(([k, l]) => `<button class="${State.rankTab === k ? 'on' : ''}" data-act="ranktab" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="row mt" style="gap:8px"><select class="in" data-model="rankYear"><option value="">Histórico</option>${years.map(y => `<option ${y === State.rankYear ? 'selected' : ''}>${y}</option>`).join('')}</select>
    <select class="in" data-model="rankSuerte"><option value="">Todas las faenas</option>${RULES.ORDER_EQ.map(k => `<option value="${k}" ${k === State.rankSuerte ? 'selected' : ''}>${esc(FN(k))}</option>`).join('')}</select></div>
    <div class="row mt" style="gap:8px"><select class="in" data-model="rankEstado"><option value="">Todo México</option>${estados.map(s => `<option ${s === State.rankEstado ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>

const getP = (o, p) => p.split('.').reduce((x, k) => x == null ? x : x[k], o);
function setP(o, p, v){ const ks = p.split('.'); let x = o; ks.slice(0, -1).forEach(k => { if (x[k] == null) x[k] = {}; x = x[k]; }); x[ks[ks.length - 1]] = v; }
const DEFS = key => { const [t, fk] = key.split(':'); if (t === 'eq') return RULES.eqDefs(fk); if (fk === 'ternaPial') return RULES.infDefs('terna', RULES.TERNA_INF_PIAL); if (fk === 'ternaCab') return RULES.infDefs('terna', RULES.TERNA_INF_CAB); return RULES.infDefs(fk); };

function jSelWho(path, ev, tid, label){

}
function jSel(path, list, placeholder, withPts = true){
  const cur = getP(State.j.d, path) || '';
  return `<select class="in" data-jp="${path}"><option value="">${placeholder}</option>${list.map(x => `<option value="${x[0]}" ${x[0] === cur ? 'selected' : ''}>${esc(x[1])}${withPts && x[2] != null ? ' · ' + x[2] : ''}</option>`).join('')}</select>`;
}
function jTog(path, label, pts){ const on = !!getP(State.j.d, path); return `<button class="tog ${on ? 'on' : ''}" data-jt="${path}">${on ? '✓ ' : ''}${esc(label)}${pts != null ? ` <b>${signed(pts)}</b>` : ''}</button>`; }
function jArr(path, list, ptsFn){
  const cur = getP(State.j.d, path) || [];
  return `<div class="chips">${list.map((x, i) => { const on = cur.includes(x[0]); const p = ptsFn ? ptsFn(i, x) : x[2]; return `<button class="tog ${on ? 'on' : ''}" data-ja="${path}" data-v="${x[0]}">${on ? '✓ ' : ''}${esc(x[1])} <b>${signed(p)}</b></button>`; }).join('')}</div>`;
}
function jStep(path, min, max, label){ const v = +getP(State.j.d, path) || 0; return `<div class="row between" style="margin-top:8px"><span class="small" style="font-weight:600">${label}</span><span class="stepper"><button data-js="${path}" data-d="-1" data-min="${min}" data-max="${max}">−</button><b>${v}</b><button data-js="${path}" data-d="1" data-min="${min}" data-max="${max}">+</button></span></div>`; }
function jNum(path, label, ph, step = 'any'){ return `<div><label class="f">${label}</label><input class="in" type="number" inputmode="decimal" step="${step}" min="0" placeholder="${ph || ''}" value="${esc(getP(State.j.d, path) ?? '')}" data-jp="${path}"></div>`; }
function jMalos(path, key, title = 'Infracciones (puntos malos)'){
  const cur = getP(State.j.d, path) || [], defs = DEFS(key);
  return `<div class="mini-l">${title}</div><div>${cur.map((m, i) => { const df = defs.find(x => x[0] === m.c) || [m.c, m.c, 0]; return `<span class="tag bad">${esc(df[0].replace(/^[ge]/, ''))} · ${esc(df[1])}${m.n > 1 ? ' ×' + m.n : ''} <b>−${df[2] * (m.n || 1)}</b><button data-jrm="${path}" data-i="${i}" aria-label="Quitar">${I.x}</button></span>`; }).join('')}</div>

function infPicker(path, key){

    const cur = getP(State.j.d, path) || [], list = defs.filter(x => !q || norm(x[1] + ' ' + x[0]).includes(norm(q)));
    const own = list.filter(x => !/^[ge]/.test(x[0]) || isEq && !x[0].startsWith('e')), gen = list.filter(x => !own.includes(x));
    const item = x => { const c = cur.find(m => m.c === x[0]); return `<button class="check-it row" data-pick="${x[0]}" style="width:100%;text-align:left;background:${c ? 'rgba(239,68,68,.1)' : 'var(--bg2)'};border:1px solid ${c ? 'rgba(239,68,68,.45)' : 'var(--line2)'};border-radius:12px;padding:10px 12px;margin-top:6px;cursor:pointer"><span class="chip" style="min-width:44px;justify-content:center">${esc(x[0].replace(/^[ge]/, ''))}</span><span class="grow small" style="color:var(--text)">${esc(x[1])}</span><b style="color:#ff9a9a">−${x[2]}</b>${c ? `<span class="badge-n">${c.n}</span>` : ''}</button>`; };
    $('#modal').innerHTML = `<div class="modal"><div class="box"><div class="row between"><div style="font-weight:800;font-size:17px">${isEq ? 'Infracción al equipo' : 'Agregar infracción'}</div><button class="btn sm" data-close="1">Listo</button></div>
      <input class="in mt" id="pq" placeholder="Buscar…" value="${esc(q)}"><div class="small mut" style="margin-top:6px">Toca para sumar; toca de nuevo para contar otra vez.</div>
      ${own.length ? `<div class="mini-l">${isEq ? 'De esta faena' : 'Infracciones de la faena'}</div>${own.map(item).join('')}` : ''}${gen.length ? `<div class="mini-l">Sanciones generales</div>${gen.map(item).join('')}` : ''}</div></div>`;
    const inp = $('#pq'); inp.oninput = () => { q = inp.value; const pos = inp.selectionStart; draw(); const n = $('#pq'); n.focus(); n.setSelectionRange(pos, pos); };
    $('#modal .modal').onclick = e => {
      if (e.target.classList.contains('modal') || e.target.closest('[data-close]')) { $('#modal').innerHTML = ''; render(); return; }
      const b = e.target.closest('[data-pick]'); if (!b) return;
      const arr = getP(State.j.d, path) || []; const ex = arr.find(m => m.c === b.dataset.pick);
      if (ex) ex.n = (ex.n || 1) + 1; else arr.push({ c: b.dataset.pick, n: 1 });
      setP(State.j.d, path, arr); State.j.dirty = true; draw();
    };
  };
  draw();
}
async function safe(fn, okMsg){ try { await fn(); if (okMsg) toast(okMsg, 'ok'); } catch (e) { toast(e.message || 'Ocurrió un error', 'err'); } render(); }

/* ------------------------- ACCIONES ------------------------- */
const curEv = () => DB.get('events', State.param);
async function updEv(patch){ const ev = curEv(); await DB.put('events', { ...ev, ...patch, updatedAt: Date.now() }); }
async function confirmDiscard(){ if (State.j && State.j.dirty) return ask('Cambios sin publicar', 'Tienes cambios sin publicar en esta faena. ¿Descartarlos?', 'Descartar', true); return true; }

const ACT = {

  async logout(){ await DB.backend.logout(); State.user = null; State.j = null; go('inicio'); },

    }
    toast('Ya se calificaron todas las faenas');
  },
  async newEvent(){
    const u = State.user, L = myLienzo(u); if (!L) return;

    await safe(async () => { await DB.put('events', ev); await audit('crear', `Creó la charreada “${ev.title}” en ${L.name}`); go('panel-evento-' + ev.id); });
  },
  async evStatus(el){

    if (s === 'finalizado' && !(await ask('Finalizar charreada', 'Las calificaciones quedarán cerradas. Los jueces aún podrán entregar las hojas.', 'Finalizar', true))) return;
    if (s === 'en_vivo' && ev.status === 'programado' && !(await ask('Iniciar en vivo', 'El público verá la charreada en vivo y los jueces podrán calificar.', 'Iniciar'))) return;
    await safe(async () => { await updEv({ status: s, ...(s === 'en_vivo' ? { startedAt: Date.now() } : {}), ...(s === 'finalizado' ? { endedAt: Date.now() } : {}) }); await audit('estado', `“${ev.title}” → ${statusLabel(s)}`); }, statusLabel(s));
  },
  async reqOfficial(){ const ev = curEv(); await safe(async () => { await updEv({ requestOfficial: !ev.requestOfficial }); if (!ev.requestOfficial) await audit('solicitud', `Solicitó oficializar “${ev.title}”`); }); },
  async toggleOfficial(el){ const ev = DB.get('events', el.dataset.id); await safe(async () => { await DB.put('events', { ...ev, official: !ev.official, requestOfficial: !ev.official ? true : ev.requestOfficial, officialBy: State.user.id, updatedAt: Date.now() }); await audit('oficial', `${ev.official ? 'Quitó oficial a' : 'Marcó como oficial'}: ${ev.title}`); }, ev.official ? 'Ya no es oficial' : 'Charreada oficial'); },
  async denyOfficial(el){ const ev = DB.get('events', el.dataset.id); await safe(async () => { await DB.put('events', { ...ev, requestOfficial: false, updatedAt: Date.now() }); await audit('oficial', `Rechazó oficializar: ${ev.title}`); }); },
  async toggleSuerte(el){ const ev = curEv(), s = el.dataset.s, order = ev.mode === 'completo' ? RULES.ORDER_CC : RULES.ORDER_EQ; const list = ev.suertes.includes(s) ? ev.suertes.filter(x => x !== s) : order.filter(x => ev.suertes.includes(x) || x === s); await safe(() => updEv({ suertes: list })); },
  async delTeam(el){ const ev = curEv(); if (!(await ask('Quitar', 'Se quitará del registro de la charreada.', 'Quitar', true))) return; await safe(() => updEv({ teams: ev.teams.filter(t => t.id !== el.dataset.id), charros: ev.charros.filter(c => c.teamId !== el.dataset.id) })); },
  async delCharro(el){ const ev = curEv(); await safe(() => updEv({ charros: ev.charros.filter(c => c.id !== el.dataset.id) })); },
  async delEvent(){ const ev = curEv(); if (!(await ask('Eliminar charreada', 'Dejará de mostrarse en la plataforma.', 'Eliminar', true))) return; await safe(async () => { await DB.put('events', { ...ev, deleted: true, updatedAt: Date.now() }); await audit('eliminar', `Eliminó “${ev.title}”`); go('panel'); }); },
  // ---- juez ----
  async jPublish(){
    const j = State.j, ev = DB.get('events', j.eid), u = State.user, team = ev.teams.find(t => t.id === j.tid);
    if (!canScore(u, ev)) return toast('La charreada no está en vivo', 'err');
    if (isLocked(ev, team.id) && !isSuper(u)) return toast('La hoja ya fue entregada', 'err');
    const d = j.d, r = RULES.calc(j.fk, d);
    if (!r.parts.length) return toast('Elige al competidor de la faena', 'err');
    const prev = evScores(ev.id).find(s => s.teamId === team.id && s.faena === j.fk);
    const row = scoreRow(ev, team, j.fk, clone(d), [u.id, u.name], Date.now());
    if (prev) { row.createdAt = prev.createdAt; row.history = [...(prev.history || []), { net: prev.net, at: Date.now(), by: u.name }]; }
    await safe(async () => { await DB.put('scores', row); await audit(prev ? 'corregir' : 'calificar', `${FN(j.fk)} · ${team.name}: ${prev ? prev.net + ' → ' : ''}${row.net} pts (B ${row.buenos}, M ${row.malos}${row.eq ? ', Eq ' + row.eq : ''}) en “${ev.title}”`); j.dirty = false; }, prev ? 'Corrección publicada' : `Publicado: ${row.net} pts`);
  },
  async cosign(el){ const sh = DB.get('sheets', el.dataset.id), u = State.user; await safe(async () => { await DB.put('sheets', { ...sh, jueces: [...sh.jueces, { id: u.id, name: u.name, ts: Date.now() }] }); await audit('firma', `${u.name} firmó la hoja ${sh.id}`); }, 'Firma agregada'); },

  // ---- admin ----
  async approve(el){ const p = DB.get('profiles', el.dataset.id); await safe(async () => { await DB.put('profiles', { ...p, status: 'aprobado', approvedBy: State.user.id, approvedAt: Date.now() }); if (p.role === 'lienzo') { const L = DB.get('lienzos', p.lienzoId); if (L) await DB.put('lienzos', { ...L, status: 'aprobado' }); } await audit('aprobar', `Autorizó a ${p.name} (${roleName(p.role)})`); }, 'Cuenta autorizada'); },
  async reject(el){ const p = DB.get('profiles', el.dataset.id); const why = await ask('Rechazar solicitud', `${p.name} no podrá operar en la plataforma.`, 'Rechazar', true, true); if (!why) return;
    await safe(async () => { await DB.put('profiles', { ...p, status: 'rechazado', reason: why }); if (p.role === 'lienzo') { const L = DB.get('lienzos', p.lienzoId); if (L) await DB.put('lienzos', { ...L, status: 'rechazado' }); } await audit('rechazar', `Rechazó a ${p.name}. Motivo: ${why}`); }, 'Solicitud rechazada'); },
  async userSt(el){ const p = DB.get('profiles', el.dataset.id); if (!(await ask('Suspender cuenta', `${p.name} ya no podrá operar.`, 'Suspender', true))) return; await safe(async () => { await DB.put('profiles', { ...p, status: el.dataset.s }); await audit('suspender', `Suspendió a ${p.name}`); }, 'Cuenta suspendida'); },

};

/* ---------- eventos de la mesa del juez ---------- */
function jMark(){ State.j.dirty = true; render(); }
document.addEventListener('click', async e => {
  const t = e.target;
  const jt = t.closest('[data-jt]'); if (jt) { e.preventDefault(); setP(State.j.d, jt.dataset.jt, !getP(State.j.d, jt.dataset.jt)); return jMark(); }
  const ja = t.closest('[data-ja]'); if (ja) { e.preventDefault(); const a = getP(State.j.d, ja.dataset.ja) || []; const v = ja.dataset.v; setP(State.j.d, ja.dataset.ja, a.includes(v) ? a.filter(x => x !== v) : [...a, v]); return jMark(); }
  const js = t.closest('[data-js]'); if (js) { e.preventDefault(); const v = (+getP(State.j.d, js.dataset.js) || 0) + (+js.dataset.d); setP(State.j.d, js.dataset.js, Math.max(+js.dataset.min, Math.min(+js.dataset.max, v))); return jMark(); }
  const jr = t.closest('[data-jrm]'); if (jr) { e.preventDefault(); const a = getP(State.j.d, jr.dataset.jrm) || []; const i = +jr.dataset.i; if (a[i].n > 1) a[i].n--; else a.splice(i, 1); setP(State.j.d, jr.dataset.jrm, a); return jMark(); }
  const jd = t.closest('[data-jadd]'); if (jd) { e.preventDefault(); return infPicker(jd.dataset.jadd, jd.dataset.key); }
  const ji = t.closest('[data-jaddint]'); if (ji) { e.preventDefault(); const d = State.j.d; const hasCab = RULES.calc('terna', d).rows.some(r => r.ok && r.tipo === 'cabeza'); d.intentos.push({ l: d.intentos.length % 3, tipo: hasCab ? 'pial' : 'cabeza', res: '', fl: [], rm: [], m: [], dq: false }); return jMark(); }
  const jx = t.closest('[data-jdel]'); if (jx) { e.preventDefault(); State.j.d.intentos.splice(+jx.dataset.i, 1); return jMark(); }
  const jte = t.closest('[data-jteam]'); if (jte) { e.preventDefault(); if (!(await confirmDiscard())) return; State.j.tid = jte.dataset.jteam; State.j.d = null; return render(); }
  const jf = t.closest('[data-jfaena]'); if (jf) { e.preventDefault(); if (!(await confirmDiscard())) return; State.j.fk = jf.dataset.jfaena; State.j.d = null; render(); document.getElementById('jform') && document.getElementById('jform').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const el = t.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'reg') e.preventDefault();
  fn(el);
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.jp) { let v = el.value; if (el.dataset.num) v = +v; if (el.type === 'number') v = el.value; setP(State.j.d, el.dataset.jp, v);
    if (el.dataset.jp.endsWith('.tipo')) { const i = el.dataset.jp.split('.')[1]; Object.assign(State.j.d.intentos[i], { res: '', fl: [], rm: [] }); }
    if (/\.res$/.test(el.dataset.jp) && !el.value) { const base = el.dataset.jp.replace(/\.res$/, ''); ['fl','rm','es','ex'].forEach(k => { if (getP(State.j.d, base + '.' + k)) setP(State.j.d, base + '.' + k, []); }); }
    if (el.dataset.jp === 'cls' || el.dataset.jp === 'vuelta') { /* recalcula */ }
    return jMark(); }
  if (el.dataset.model) { State[el.dataset.model] = el.value; render(); return; }
  if (el.dataset.upload) { const f = el.files[0]; if (!f) return; toast('Subiendo video…'); await safe(async () => { const url = await DB.backend.uploadVideo(f, el.dataset.upload); await updEv({ videoUrl: url }); await audit('video', `Subió video a “${curEv().title}”`); }, 'Video publicado'); }
});
let searchT;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.jp === 'notes') { setP(State.j.d, 'notes', el.value); State.j.dirty = true; return; }
  if (el.dataset.model === 'histQ') { clearTimeout(searchT); searchT = setTimeout(() => { State.histQ = el.value; const pos = el.selectionStart; render(); const n = document.querySelector('[data-model="histQ"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
});
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries()), k = f.dataset.form;
  if (k === 'login') return safe(async () => { State.user = await DB.backend.login(d.email.trim(), d.pass); State.j = null; go(isSuper(State.user) ? 'admin' : 'cuenta'); }, 'Bienvenido');
  if (k === 'register') { const payload = { role: State.regRole, name: d.name.trim(), email: d.email.trim().toLowerCase(), phone: d.phone || '', invite: (d.invite || '').trim().toUpperCase() || null, lienzoName: d.lienzoName, city: d.city, state: d.state, lienzoId: d.lienzoId };
    return safe(async () => { const r = await DB.backend.register(payload, d.pass); if (r.needsConfirm) { toast('Revisa tu correo para confirmar la cuenta y luego entra.', 'ok'); State.authMode = 'login'; return; } State.user = r.profile; go('cuenta'); }); }
  if (k === 'evData') { const ev = curEv(); const patch = { title: d.title.trim(), date: d.date, category: d.category }; if (d.mode && d.mode !== (ev.mode || 'equipos')) { patch.mode = d.mode; patch.suertes = (d.mode === 'completo' ? RULES.ORDER_CC : RULES.ORDER_EQ).slice(); } return safe(() => updEv(patch), 'Datos guardados'); }
  if (k === 'addTeam') { const ev = curEv(); const id = 't' + uid();
    if (ev.mode === 'completo') return safe(() => updEv({ teams: [...ev.teams, { id, name: d.name.trim(), assoc: (d.assoc || '').trim(), state: d.state }], charros: [...ev.charros, { id: 'c' + uid(), name: d.name.trim(), teamId: id }] }), 'Charro inscrito');
    return safe(() => updEv({ teams: [...ev.teams, { id, name: d.name.trim(), state: d.state, capitan: (d.capitan || '').trim() }] }), 'Equipo agregado'); }
  if (k === 'addCharro') { const ev = curEv(), name = d.name.trim(); if (!name) return; return safe(async () => { await updEv({ charros: [...ev.charros, { id: 'c' + uid(), name, teamId: f.dataset.team }] }); setTimeout(() => { const n = document.querySelector(`form[data-team="${f.dataset.team}"] input`); if (n) n.focus(); }, 30); }); }
  if (k === 'stream') return safe(async () => { await updEv({ streamUrl: d.url.trim() }); await audit('transmision', `Actualizó la transmisión de “${curEv().title}”`); }, 'Transmisión guardada');
  if (k === 'video') return safe(() => updEv({ videoUrl: d.url.trim() }), 'Video guardado');
  if (k === 'entrega') { const ev = DB.get('events', State.param), team = ev.teams.find(t => t.id === State.param2), u = State.user, id = `${ev.id}-${team.id}`, prev = DB.get('sheets', id);
    const missing = ev.suertes.filter(fk => !evScores(ev.id).some(s => s.teamId === team.id && s.faena === fk));
    if (missing.length && !(await ask('Faenas sin calificar', `Faltan: ${missing.map(FN).join(', ')}. Se entregarán en cero.`, 'Entregar así'))) return;
    return safe(async () => { await DB.put('sheets', { id, eventId: ev.id, teamId: team.id, capitan: d.capitan.trim(), capitanFirma: d.capitan.trim(), hora: d.hora || '', entregada: true, entregadaAt: Date.now(), jueces: [{ id: u.id, name: u.name, ts: Date.now() }], reopened: prev ? prev.reopened : undefined, totals: { final: sum(evScores(ev.id).filter(s => s.teamId === team.id).map(s => s.net)) } });
      await audit('entrega', `Entregó la hoja de ${team.name} en “${ev.title}”`); }, 'Hoja firmada y entregada'); }
  if (k === 'invite') { if (d.role === 'juez' && !d.lienzoId) return toast('Elige el lienzo del juez', 'err'); const code = genCode(d.role === 'juez' ? 'JUEZ' : 'LIENZO');
    return safe(async () => { await DB.put('invites', { id: code, code, role: d.role, lienzoId: d.role === 'juez' ? d.lienzoId : null, used: false, createdBy: State.user.id, createdAt: Date.now() }); await audit('invitacion', `Creó invitación ${code} (${roleName(d.role)})`); }, 'Código creado: ' + code); }
});

/* ------------------------- ARRANQUE ------------------------- */
(async function boot(){
  $('#view').innerHTML = '<div class="empty">Cargando…</div>';
  const hasKeys = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
  const mode = CONFIG.MODE === 'demo' || CONFIG.MODE === 'real' ? CONFIG.MODE : (hasKeys ? 'real' : 'demo');
  DB.backend = mode === 'real' ? Remote : Local;
  try { if (mode === 'real' && !hasKeys) throw new Error('Faltan SUPABASE_URL y SUPABASE_ANON_KEY'); await DB.backend.init(); }
  catch (e) {
    if (mode === 'real') { $('#view').innerHTML = `<div class="empty">No se pudo conectar al servidor.<div class="small mut mt">${esc(e.message || e)}</div><button class="btn sm mt" onclick="location.reload()">Reintentar</button></div>`; return; }
    throw e;
  }
  try { State.user = await DB.backend.restore(); } catch (e) { State.user = null; }
  parseRoute(); render();
})();
