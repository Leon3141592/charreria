<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0a08">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Charrería Pro">
<title>Charrería Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a08;--bg2:#15100c;--card:#1c1510;--card2:#251b14;--line:#3a2b20;--line2:#4d3a2b;--gold:#d9a84e;--gold2:#f2cd7e;--vino:#8e1b2c;--vino2:#b02a3e;--red:#ef4444;--green:#3fb37f;--blue:#5b9bd5;--text:#f4ece1;--mut:#a8988a;--mut2:#76685c;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* La app ya es oscura: sin esto, el modo oscuro forzado de algunos navegadores vuelve negro el fondo blanco de los dibujos */
:root{color-scheme:dark}.thumb,.ref,.refstrip .mini,#dp,.qr{color-scheme:only light}.qr{display:block;flex:none;width:128px;height:128px;background:#fff;border-radius:8px;image-rendering:pixelated}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));min-height:100vh;background:radial-gradient(1200px 500px at 50% -200px,rgba(142,27,44,.28),transparent 70%),var(--bg)}
a{color:var(--gold2)}button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(14,10,8,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);flex:1;min-width:0}
.brand b{font-family:'Cinzel',serif;font-size:19px;font-weight:800;letter-spacing:.03em;white-space:nowrap}.brand b span{color:var(--gold)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--vino2),#4a0d17);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(242,205,126,.35);flex:none}
.logo svg{width:20px;height:20px;color:var(--gold2)}
.chr{border-top:1px solid var(--line);padding:9px 0 2px;margin-top:6px}.chr .lnk{display:flex;align-items:center;gap:4px;min-width:0;background:none;border:0;padding:4px 0;color:var(--text);font:inherit;font-weight:700;text-align:left;cursor:pointer}.chr .lnk:hover .ell{color:var(--gold2)}
.rank.tap{cursor:pointer;transition:background .15s}.rank.tap:hover,.rank.tap:focus-visible{background:var(--card2);outline:none}
/* Tarjeta coleccionable: marco metálico por rareza, foto arriba, franja vino con el nombre, estadísticas abajo */
.tc-wrap{perspective:1100px;display:flex;justify-content:center;padding:4px 0 6px}
.tc{--t1:#f2cd7e;--t2:#8a6420;--mx:50%;--my:30%;position:relative;width:min(318px,84vw);aspect-ratio:5/7;border-radius:18px;padding:8px;background:linear-gradient(150deg,var(--t1),var(--t2) 38%,var(--t1) 62%,var(--t2));box-shadow:0 22px 44px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.25);transform-style:preserve-3d;transition:transform .18s ease-out;user-select:none}
.tc.bronce{--t1:#d39a68;--t2:#5a361c}.tc.plata{--t1:#e4e8ee;--t2:#646d7a}.tc.oro{--t1:#f6d68e;--t2:#8a6420}.tc.leyenda{--t1:#f6d68e;--t2:#8e1b2c}
.tc::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.38),transparent 42%);mix-blend-mode:overlay}
.tc .in{position:relative;height:100%;border-radius:12px;background:#120c09;overflow:hidden;display:flex;flex-direction:column}
.tc .in>*{flex-shrink:0}
.tc .pic{position:relative;flex:1 1 34%;min-height:112px;background:radial-gradient(circle at 50% 110%,rgba(176,42,62,.55),transparent 60%),repeating-linear-gradient(135deg,#1d1410 0 12px,#17100c 12px 24px);display:grid;place-items:center;overflow:hidden}
.tc .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tc .pic .ini{font-family:'Cinzel',serif;font-size:64px;font-weight:800;color:var(--t1);opacity:.85;text-shadow:0 2px 0 #000}
.tc .ovr{position:absolute;top:8px;left:8px;width:52px;padding:5px 0 4px;border-radius:10px;background:rgba(10,7,5,.78);border:1px solid var(--t1);text-align:center;line-height:1}
.tc .ovr b{display:block;font-family:'Cinzel',serif;font-size:25px;color:var(--t1)}.tc .ovr span{font-size:8.5px;letter-spacing:.12em;font-weight:800;color:var(--text);text-transform:uppercase}
.tc .tier{position:absolute;top:10px;right:10px;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(10,7,5,.78);color:var(--t1);border:1px solid var(--t1)}
.tc .live{position:absolute;bottom:8px;right:8px;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--vino2);color:#fff;animation:pulse 1.6s infinite}
.tc .band{background:linear-gradient(90deg,var(--vino),var(--vino2) 50%,var(--vino));border-block:1px solid var(--t1);padding:7px 10px 6px;text-align:center}
.tc .band .nm{font-family:'Cinzel',serif;font-weight:800;font-size:15.5px;letter-spacing:.04em;text-transform:uppercase;color:#fff;line-height:1.15;text-wrap:balance}
.tc .band .sb{font-size:10.5px;color:#f3d9a6;margin-top:2px}
.tc .st{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#2a1e16;margin:8px 8px 0;border-radius:9px;overflow:hidden}
.tc .st div{background:#18110d;padding:4px 2px 3px;text-align:center}.tc .st b{display:block;font-family:'Cinzel',serif;font-size:15px;color:var(--gold2);font-variant-numeric:tabular-nums}.tc .st span{font-size:8.5px;letter-spacing:.1em;font-weight:700;color:var(--mut);text-transform:uppercase}
.tc .su{margin:7px 10px 0;display:grid;gap:4px}.tc .su div{display:grid;grid-template-columns:104px 1fr 28px;align-items:center;gap:6px;font-size:10px;color:var(--mut)}
.tc .su i{display:block;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--vino2),var(--t1))}.tc .su b{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.tc .bd{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:auto 8px 0;padding-top:6px}
.tc .bd span{font-size:9px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid rgba(242,205,126,.45);color:var(--gold2);background:rgba(242,205,126,.07)}
.tc .ft{display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);padding:6px 10px 7px}
@media (prefers-reduced-motion: reduce){.tc{transition:none}.tc .live{animation:none}}
.upg-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-weight:800;letter-spacing:.12em;font-size:12px;padding:4px 12px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1c1510}
.upg-badge svg{width:14px;height:14px;flex:none}
.upg-li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px}.upg-li svg{width:18px;height:18px;flex:none;color:var(--gold2);margin-top:2px}
.lock{position:relative;filter:blur(3px);opacity:.5;pointer-events:none;user-select:none}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.refgrid .card,.refgrid .card+.card{margin:0}.ref{display:block;width:100%;height:auto;background:#fff;border-radius:10px}.ref.big{width:min(100%,300px);margin:0 auto 12px}
.refstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.refstrip button{flex:none;width:58px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:11px;cursor:pointer}.refstrip button.on{border-color:var(--gold)}.refstrip .mini{display:block;width:100%;height:auto;background:#fff;border-radius:6px}
.tcg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}.tcg-grid a{display:block;text-decoration:none;color:inherit}.tcg-grid .tc-wrap{zoom:.5;padding:0}
.lp-hero{text-align:center;padding:26px 16px}.lp-price{font-family:'Cinzel',serif;font-size:38px;color:var(--gold2);line-height:1.1;margin-top:10px}.lp-steps{counter-reset:p;display:grid;gap:10px;margin-top:10px}.lp-steps div{counter-increment:p;display:flex;gap:12px;align-items:flex-start}.lp-steps div::before{content:counter(p);flex:none;width:30px;height:30px;border-radius:50%;background:var(--vino2);color:#fff;font-weight:800;display:grid;place-items:center}.lp-q summary{cursor:pointer;font-weight:700;padding:10px 0}.lp-q{border-top:1px solid var(--line)}.lp-q:first-child{border-top:0}
.tcg-ban{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;margin-top:12px;background:linear-gradient(120deg,#5c1220,#1c1510 70%);border-color:var(--gold)}
/* Carnet: proporción de credencial (85.6 × 54 mm) */
.carnet{position:relative;width:min(100%,520px);min-height:0;margin:0 auto;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1d140e,#120c09 60%,#24110f);border:1.5px solid var(--gold);box-shadow:0 18px 40px rgba(0,0,0,.5);color:var(--text);display:flex;flex-direction:column}
.carnet .ch{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,var(--vino),var(--vino2));border-bottom:1px solid var(--gold)}
.carnet .ch b{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.06em;color:#fff}.carnet .ch span{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#f3d9a6;margin-left:auto;text-align:right}
.carnet .cb{flex:1;display:flex;gap:12px;padding:10px 12px;min-height:0}
@media (min-width:560px){.carnet{aspect-ratio:85.6/54}}
.carnet .cp{flex:0 0 30%;min-height:150px;border-radius:10px;overflow:hidden;background:#24190f;border:1px solid var(--line2);display:grid;place-items:center}.carnet .cp img{width:100%;height:100%;object-fit:cover}
.carnet .cf{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;align-content:start;font-size:10px}
.carnet .cf div span{display:block;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.carnet .cf div b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carnet .cf .w{grid-column:1/-1}.carnet .cf .nm b{font-family:'Cinzel',serif;font-size:16px;color:var(--gold2)}
.carnet .cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);font-size:8.5px;color:var(--mut2);letter-spacing:.04em}
.carnet .seal{position:absolute;left:calc(12px + 30% - 50px);bottom:32px;width:54px;height:54px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;text-align:center;font-size:7px;font-weight:800;letter-spacing:.08em;color:var(--gold2);background:rgba(10,7,5,.6);transform:rotate(-12deg)}
.esc-c{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.esc-c:last-child{border-bottom:0}
.esc-c .n{display:flex;align-items:center;gap:6px;flex:none}.esc-c .n b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}.esc-c .n button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:18px;cursor:pointer}
.esc-c.on{color:var(--gold2)}.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.stepbar button{min-height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--mut);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:4px}.stepbar button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1c1510;border-color:transparent}
.bigchoice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 16px;border-radius:16px;border:1px solid var(--line2);background:var(--card);color:var(--text);font:inherit;cursor:pointer;margin-top:12px}.bigchoice svg{width:34px;height:34px;flex:none;color:var(--gold2)}.bigchoice b{display:block;font-size:17px}.bigchoice span span{color:var(--mut);font-size:13.5px}
.bignav{display:flex;gap:8px;margin-top:16px}.bignav .btn{min-height:58px;font-size:17px}.bignav .pri{flex:1}
.thumb{width:64px;height:64px;flex:none;background:#fff;border-radius:10px;border:1px solid var(--line2);display:block}
.esc-ej{display:grid;grid-template-columns:26px 1fr 64px 64px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.esc-ej select{min-height:38px;padding:4px 6px;font-size:12.5px}
.ph{object-fit:cover;border-radius:50%;flex:none;border:1px solid var(--line2);background:var(--card2);display:block}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--gold2);text-decoration:none;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 24px}
.wrap.wide{max-width:900px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(21,16,12,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mut2);text-decoration:none;padding:6px 0 4px;border-radius:12px;position:relative}
.nav a.on{color:var(--gold2)}.nav a.on::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
.nav svg{width:23px;height:23px}
.nav .dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg2);animation:pulse 1.6s infinite}
svg{flex:none}h1,h2,h3{margin:0}
.h1{font-family:'Cinzel',serif;font-size:24px;font-weight:800;line-height:1.15}
.h2{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
.h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}.h2 a{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;order:3}
.sub{color:var(--mut);font-size:13.5px}.mut{color:var(--mut)}.mut2{color:var(--mut2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.card+.card{margin-top:10px}
.list>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.live{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.45);color:#ff8a8a}.chip.live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
.chip.gold{background:rgba(217,168,78,.12);border-color:rgba(217,168,78,.45);color:var(--gold2)}
.chip.green{background:rgba(63,179,127,.12);border-color:rgba(63,179,127,.45);color:#7fdcb0}
.chip.blue{background:rgba(91,155,213,.12);border-color:rgba(91,155,213,.45);color:#9cc5ee}
.chip.red{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#ff9a9a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:12px 16px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;background:var(--card2);color:var(--text);border:1px solid var(--line2);min-height:46px}
.btn svg{width:18px;height:18px}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1a08;border-color:transparent}
.btn.vino{background:linear-gradient(180deg,var(--vino2),var(--vino));color:#fff;border-color:transparent}
.btn.live{background:linear-gradient(180deg,#f25555,#c92a2a);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:11px}.btn.block{width:100%}.btn:disabled{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>.btn{flex:1}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
.in:focus{border-color:var(--gold)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.in{min-height:64px;resize:vertical}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--line2)}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}.scroller>*{flex:none}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.tog{border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mut);text-align:left}
.tog.on{background:rgba(217,168,78,.14);border-color:var(--gold);color:var(--gold2)}
.tog.done{border-color:rgba(63,179,127,.55);color:#9fe3c3}
.tog.done.on{background:rgba(63,179,127,.16);color:#b8f0d4;border-color:var(--green)}
.tog b{font-weight:800}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;border:1px solid rgba(239,68,68,.35);background:radial-gradient(400px 200px at 100% 0,rgba(239,68,68,.22),transparent 70%),linear-gradient(160deg,#2a1510,#160e0b)}
.hero .score-big{font-family:'Cinzel',serif;font-size:40px;font-weight:800;color:var(--gold2);line-height:1}
.pattern{position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 14px,var(--vino2) 14px 24px,transparent 24px 28px);opacity:.55}
.evc{display:block;text-decoration:none;color:inherit}.evc .t{font-weight:800;font-size:15.5px;line-height:1.25}.evc .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.datebox{width:48px;text-align:center;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);padding:6px 0;flex:none}
.datebox b{display:block;font-family:'Cinzel',serif;font-size:19px;color:var(--gold2);line-height:1}.datebox span{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.rank{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line)}.rank:last-child{border-bottom:0}
.pos{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg2);color:var(--mut);border:1px solid var(--line2);flex:none}
.pos.p1{background:linear-gradient(160deg,#f7d98c,#c8902e);color:#2a1a08;border:0}.pos.p2{background:linear-gradient(160deg,#e4e4e4,#9a9a9a);color:#1d1d1d;border:0}.pos.p3{background:linear-gradient(160deg,#e0a072,#9b5a2e);color:#25140a;border:0}

@media print{

  @page{size:letter portrait;margin:8mm}
}

  function calcJineteo(kind, d){

  function calcTerna(d){

const fdate = iso => { if(!iso) return ''; const [y,m,d] = iso.slice(0,10).split('-').map(Number); return `${d} ${MESES[m-1]} ${y}`; };
const ftime = ts => new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const fdt = ts => { const d = new Date(ts); return `${d.getDate()} ${MESES[d.getMonth()]} · ${ftime(ts)}`; };

const demoHash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return 'd' + (h >>> 0).toString(36); };
const genCode = p => p + '-' + Math.random().toString(36).slice(2,6).toUpperCase() + Math.random().toString(36).slice(2,4).toUpperCase();

const DB = {
  data: {}, backend: null,
  all(t){ return (this.data[t] || []).filter(r => !r.deleted); },
  get(t, id){ return this.all(t).find(r => r.id === id); },
  async put(t, row){
    const arr = this.data[t] || (this.data[t] = []);
    const i = arr.findIndex(r => r.id === row.id); const prev = i >= 0 ? arr[i] : null;
    if (i >= 0) arr[i] = row; else arr.push(row);
    try { await this.backend.put(t, row); }
    catch (e) { const j = arr.findIndex(r => r.id === row.id); if (prev) arr[j] = prev; else arr.splice(j, 1); throw e; }
    return row;
  },
  async del(t, id){
    const arr = this.data[t] || [], i = arr.findIndex(r => r.id === id); if (i < 0) return; const prev = arr[i]; arr.splice(i, 1);
    try { await this.backend.del(t, id); } catch (e) { arr.splice(i, 0, prev); throw e; }
  }
};

const Remote = {
  mode: 'supabase', sb: null,
  async init(){
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    this.sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { State.recovery = true; if (DB.backend === this) render(); } });
    const errs = await this.refetch();
    if (errs.length === TABLES.length) throw new Error(errs[0].message || 'Sin respuesta del servidor');
    this.sb.channel('charreriapro-all').on('postgres_changes', { event: '*', schema: 'public' }, p => {
      const t = p.table; if (!TABLES.includes(t)) return;
      const arr = DB.data[t] || (DB.data[t] = []);
      if (p.eventType === 'DELETE') DB.data[t] = arr.filter(r => r.id !== p.old.id);
      else { const row = p.new.data; const i = arr.findIndex(r => r.id === row.id); if (i >= 0) arr[i] = row; else arr.push(row); }
      onRemoteChange();
    }).subscribe();
  },
  async refetch(){ const errs = []; await Promise.all(TABLES.map(async t => { const { data, error } = await this.sb.from(t).select('id,data').limit(20000); if (error) errs.push(error); DB.data[t] = error ? [] : data.map(r => r.data); })); return errs; },
  async put(t, row){ const { error } = await this.sb.from(t).upsert({ id: row.id, data: row }); if (error) throw new Error(error.message.includes('row-level security') ? 'No tienes permiso para esta acción' : error.message); },
  async ensureProfile(user){
    let p = DB.get('profiles', user.id);
    if (!p && user.user_metadata && user.user_metadata.pending) { await createAccount(user.id, user.user_metadata.pending, {}); await this.refetch(); p = DB.get('profiles', user.id); }
    return p || null;
  },
  async restore(){ const { data } = await this.sb.auth.getSession(); return data.session ? this.ensureProfile(data.session.user) : null; },
  async login(email, pass){
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw new Error(error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos' : error.message);
    await this.refetch(); const p = await this.ensureProfile(data.user);
    if (!p) throw new Error('Tu cuenta no tiene perfil. Contacta al administrador.'); return p;
  },
  async register(payload, pass){
    const { data, error } = await this.sb.auth.signUp({ email: payload.email, password: pass, options: { data: { pending: payload } } });
    if (error) throw new Error(error.message);
    if (!data.session) return { needsConfirm: true };
    await this.refetch(); return { profile: await this.ensureProfile(data.user) };
  },
  async logout(){ await this.sb.auth.signOut(); await this.refetch(); },
  async requestReset(email){
    const { error } = await this.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) throw new Error(/rate limit/i.test(error.message) ? 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.' : error.message);
    return {};
  },
  async rpc(fn, args){
    const { data, error } = await this.sb.rpc(fn, args);
    if (error) throw new Error(/function .* does not exist|schema cache/i.test(error.message) ? 'Falta instalar la actualización más reciente en la base de datos' : error.message);
    await Promise.all(['requests','charros','teams','horses','stock','profiles','tcg_cards'].map(async t => { const { data: rows, error: e } = await this.sb.from(t).select('id,data').limit(20000); if (!e) DB.data[t] = rows.map(r => r.data); }));
    return data;
  },
  async del(t, id){ const { error } = await this.sb.from(t).delete().eq('id', id); if (error) throw new Error(error.message.includes('row-level security') ? 'No tienes permiso para esta acción' : error.message); },
  decide(r, d){ return this.rpc('decide_request', { rid: r.id, decision: d }); },

async function createAccount(id, pl, extra){
  let status = 'pendiente', lienzoId = pl.lienzoId || null; const role = pl.role; let inv = null;
  if (OPEN_ROLES.includes(role)) { status = 'aprobado'; lienzoId = null; }
  if (pl.invite) {
    inv = DB.get('invites', pl.invite);
    if (DB.backend.mode === 'demo' && (!inv || inv.used || inv.role !== role)) throw new Error('Código de invitación inválido o ya usado');
    status = 'aprobado'; if (inv && inv.lienzoId) lienzoId = inv.lienzoId;
  }
  if (role === 'lienzo') lienzoId = 'l' + uid();
  const prof = { id, name: pl.name, email: pl.email, phone: pl.phone || '', role, status, lienzoId, invite: pl.invite || null, createdAt: Date.now(), ...extra };
  await DB.put('profiles', prof);
  if (role === 'lienzo') await DB.put('lienzos', { id: lienzoId, name: pl.lienzoName, city: pl.city, state: pl.state, ownerId: id, status, createdAt: Date.now() });
  if (inv && DB.backend.mode === 'demo') await DB.put('invites', { ...inv, used: true, usedBy: id, usedAt: Date.now() });
  if (role === 'charro') { const cid = 'h' + uid();
    await DB.put('charros', { id: cid, name: pl.name, alias: pl.alias || '', state: pl.state, category: pl.category || 'Libre', photo: '', teamId: null, userId: id, createdAt: Date.now() });
    if (pl.teamReq) await DB.put('requests', { id: 'r' + uid(), type: 'roster', charroId: cid, teamId: pl.teamReq, status: 'pendiente', createdBy: id, createdAt: Date.now() }); }
  if (role === 'ganadero') await DB.put('ranches', { id: 'g' + uid(), name: pl.ranchName, ownerId: id, ownerName: pl.name, state: pl.state, city: pl.city || '', location: '', whatsapp: pl.whatsapp || '', phone: pl.phone || '', about: '', photo: '', createdAt: Date.now() });
  if (role === 'equipo') { const tid = 'q' + uid();

function genFaena(fk, ev, team, rng){
  const ch = ev.charros.filter(c => c.teamId === team.id); const P = i => ch.length ? ch[i % ch.length].id : '';
  const R = RULES, pick = l => l[Math.floor(rng() * l.length)][0], some = (l, p) => l.filter(() => rng() < p).map(x => x[0]);
  const malos = (defs, p = .35) => rng() < p ? [{ c: defs[Math.floor(rng() * Math.min(defs.length, 14))][0], n: 1 }] : [];
  const d = R.blank(fk, ev.mode);
  const cc = ev.mode === 'completo';
  switch (fk) {
    case 'cala': Object.assign(d, { who: P(0), metros: (5 + rng() * 6).toFixed(2), tiempos: String(1 + Math.floor(rng() * 5)), ld6: rng() > .35, ldPata: rng() > .6, li6: rng() > .4, liPata: rng() > .65, md: Math.floor(rng() * 3), mi: Math.floor(rng() * 3), pc: rng() > .5, m: malos(R.CALA_INF, .6), dq: rng() < .05 }); break;
    case 'piales': { d.who = P(cc ? 0 : 1); const used = []; d.tiros = d.tiros.map(o => { const r = rng() < .62 ? pick(R.PIAL_REM.filter(x => !used.includes(x[0]))) : ''; if (r) used.push(r); return { ...o, res: r, dist: r && rng() > .6 ? 1 + Math.floor(rng() * 3) : '', ex: r ? some(R.PIAL_EX, .35) : [], m: malos(R.F.piales.inf, .25) }; }); break; }
    case 'coleadero': d.coleadores = d.coleadores.map((c, i) => ({ who: P(cc ? 0 : 2 + i), pasadas: c.pasadas.map(o => { const r = rng() < .68 ? pick(R.CAIDAS) : ''; return { ...o, res: r, dist: r ? pick([...R.COLA_DIST, ['', '', 0]]) : '', ex: r ? some(R.COLA_EX, .15) : [], m: malos(R.F.coleadero.inf, .3) }; }) })); break;
    case 'toro': case 'yegua': { const cls = ['exc','buena','buena','reg','reg','mreg','min'][Math.floor(rng() * 7)]; const cols = fk === 'toro' ? R.TORO_COLS : R.YEGUA_COLS;
      Object.assign(d, { who: P(cc ? 0 : (fk === 'toro' ? 5 : 3)), cls, ad: some(cols, .22), desc: rng() < .3, tiempo: (0.6 + rng() * 3.2).toFixed(1), m: malos(R.F[fk].inf, .3), dq: rng() < .08 }); break; }
    case 'terna': { d.lazadores = [P(0), P(1), P(2)]; let cab = false, pi = false, n = 0;
      while (n < 5 && !(cab && pi)) { const tipo = cab ? 'pial' : 'cabeza'; const ok = rng() < (cab ? .45 : .55);
        const res = ok ? pick(tipo === 'pial' ? R.PIAL_RUEDO : R.CABEZA) : '';
        d.intentos.push({ l: n % 3, tipo, res, fl: res === 'floreado' ? some(R.FLOREO_TERNA.slice(0, 9), .3) : [], rm: res ? some(tipo === 'pial' ? R.REM_PIAL.slice(8) : R.REM_CABEZA, .25) : [], m: malos(tipo === 'pial' ? R.TERNA_INF_PIAL : R.TERNA_INF_CAB, .2) });
        if (ok && tipo === 'cabeza') cab = true; if (ok && tipo === 'pial') pi = true; n++; }
      d.tiempo = cab && pi ? (2 + rng() * 5).toFixed(1) : ''; break; }
    case 'mpie': case 'mcab': { d.who = P(cc ? 0 : (fk === 'mpie' ? 4 : 5)); const REM = fk === 'mpie' ? R.MPIE_REM : R.MCAB_REM, FL = fk === 'mpie' ? R.MPIE_FL : R.MCAB_FL; const used = [];
      d.tiros = d.tiros.map(o => { const r = rng() < .55 ? pick(REM.filter(x => !used.includes(x[0]))) : ''; if (r) used.push(r);
        return { ...o, res: r, fl: r ? some(FL, .25) : [], es: fk === 'mpie' && r ? some(R.MPIE_ES.slice(0, 2), .3) : [], m: malos(R.F[fk].inf, .3) }; });
      d.tiempo = (3 + rng() * 4).toFixed(1); break; }
    case 'paso': { const v = rng(); Object.assign(d, { who: P(cc ? 0 : 1), vuelta: v < .45 ? '1' : v < .7 ? '2' : '', cuarto: String(1 + Math.floor(rng() * 3)), cls: pick(R.PASO_CLS), arreo: rng() < .7 ? 'sin' : 'con', cuartear: rng() > .5, apearse: rng() > .6, desc: rng() < .25, m: malos(R.F.paso.inf, .25) }); break; }
  }

function statusChip(ev){

}
const officialChip = ev => ev.official ? `<span class="chip gold">${I.shield}Oficial</span>` : '';
const modeChip = ev => ev.mode === 'completo' ? '<span class="chip">Charro completo</span>' : ev.mode === 'escaramuza' ? '<span class="chip">Escaramuzas</span>' : `<span class="chip">${esc(ev.category || 'Libre')}</span>`;

function eventCard(ev){

    </div></div></a>`;
}
function emptyState(icon, title, text, btn){ return `<div class="card empty">${icon}<div style="font-weight:700;color:var(--text)">${title}</div><div class="small" style="margin-top:4px">${text}</div>${btn ? `<div class="mt">${btn}</div>` : ''}</div>`; }
function embed(url){
  if (!url) return ''; let m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/))) return `<iframe src="https://www.youtube.com/embed/${m[1]}?playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;

}

/* ---------- HISTORIAL ---------- */
function vHistorial(){
  const q = norm(State.histQ);
  let evs = publicEvents().filter(e => e.status === 'finalizado');
  if (State.histOficial) evs = evs.filter(e => e.official);
  if (State.histEstado) evs = evs.filter(e => lienzo(e.lienzoId).state === State.histEstado);
  if (q) evs = evs.filter(e => norm(e.title + ' ' + lienzo(e.lienzoId).name + ' ' + e.teams.map(t => t.name).join(' ') + ' ' + e.charros.map(c => c.name).join(' ')).includes(q));
  evs.sort((a, b) => b.date.localeCompare(a.date));
  const groups = {}; evs.forEach(e => { const [y, m] = e.date.split('-'); const k = `${MESES_L[+m - 1]} ${y}`; (groups[k] = groups[k] || []).push(e); });
  const estados = [...new Set(publicEvents().map(e => lienzo(e.lienzoId).state))].sort();
  let h = `<div class="h1">Historial</div><div class="sub" style="margin-top:4px">Charreadas pasadas con sus calificaciones y hojas.</div>
    <div class="mt" style="position:relative"><span style="position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--mut2)">${I.search}</span><input class="in" style="padding-left:40px" placeholder="Buscar charro, equipo, lienzo…" value="${esc(State.histQ)}" data-model="histQ"></div>
    <div class="row mt" style="gap:8px"><select class="in" data-model="histEstado" style="flex:1"><option value="">Todos los estados</option>${estados.map(s => `<option ${s === State.histEstado ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <button class="tog ${State.histOficial ? 'on' : ''}" data-act="histOficial" style="white-space:nowrap">Solo oficiales</button></div>`;
  if (!evs.length) return h + `<div class="mt">${emptyState(I.search, 'Sin resultados', 'Prueba con otra búsqueda o filtro.')}</div>`;
  Object.entries(groups).forEach(([k, list]) => { h += `<div class="h2">${k}</div><div class="list">${list.map(eventCard).join('')}</div>`; });
  return h;
}

/* ---------- RANKING ---------- */
const rankingEvents = ({ year, oficial, estado, mode }) => publicEvents().filter(e => e.status === 'finalizado' && (!oficial || e.official) && (!year || e.date.startsWith(year)) && (!estado || lienzo(e.lienzoId).state === estado) && (!mode || (e.mode || 'equipos') === mode));
function rankingCharros(opt){

async function judgeAddCharro(path, tid){

function toast(msg, type = ''){ const box = $('#toasts'); while (box.children.length > 1) box.firstChild.remove(); const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; box.appendChild(t); setTimeout(() => t.remove(), 3200); }
function ask(title, text, okLabel = 'Confirmar', danger = false, withInput = false){
  return new Promise(res => {
    $('#modal').innerHTML = `<div class="modal"><div class="box"><div style="font-weight:800;font-size:17px">${esc(title)}</div><div class="sub" style="margin-top:6px">${esc(text)}</div>${withInput ? `<input class="in mt" id="askIn" placeholder="${esc(typeof withInput === 'string' ? withInput : 'Motivo')}">` : ''}<div class="btns mt2"><button class="btn" id="askNo">Cancelar</button><button class="btn ${danger ? 'vino' : 'pri'}" id="askOk">${esc(okLabel)}</button></div></div></div>`;
    const close = v => { $('#modal').innerHTML = ''; res(v); };
    $('#askNo').onclick = () => close(false); $('#askOk').onclick = () => close(withInput ? (typeof withInput === 'string' ? $('#askIn').value.trim() : ($('#askIn').value.trim() || 'Sin motivo')) : true);
    $('#modal .modal').onclick = e => { if (e.target.classList.contains('modal')) close(false); };
  });
}
function infPicker(path, key){
  const defs = DEFS(key), isEq = key.startsWith('eq:'); let q = '';
  const draw = () => {
    const cur = getP(State.j.d, path) || [], list = defs.filter(x => !q || norm(x[1] + ' ' + x[0]).includes(norm(q)));
    const own = list.filter(x => !/^[ge]/.test(x[0]) || isEq && !x[0].startsWith('e')), gen = list.filter(x => !own.includes(x));
    const item = x => { const c = cur.find(m => m.c === x[0]); return `<button class="check-it row" data-pick="${x[0]}" style="width:100%;text-align:left;background:${c ? 'rgba(239,68,68,.1)' : 'var(--bg2)'};border:1px solid ${c ? 'rgba(239,68,68,.45)' : 'var(--line2)'};border-radius:12px;padding:10px 12px;margin-top:6px;cursor:pointer"><span class="chip" style="min-width:44px;justify-content:center">${esc(x[0].replace(/^[ge]/, ''))}</span><span class="grow small" style="color:var(--text)">${esc(x[1])}</span><b style="color:#ff9a9a">−${x[2]}</b>${c ? `<span class="badge-n">${c.n}</span>` : ''}</button>`; };
    $('#modal').innerHTML = `<div class="modal"><div class="box"><div class="row between"><div style="font-weight:800;font-size:17px">${isEq ? 'Infracción al equipo' : 'Agregar infracción'}</div><button class="btn sm" data-close="1">Listo</button></div>
      <input class="in mt" id="pq" placeholder="Buscar…" value="${esc(q)}"><div class="small mut" style="margin-top:6px">Toca para sumar; toca de nuevo para contar otra vez.</div>
      ${own.length ? `<div class="mini-l">${isEq ? 'De esta faena' : 'Infracciones de la faena'}</div>${own.map(item).join('')}` : ''}${gen.length ? `<div class="mini-l">Sanciones generales</div>${gen.map(item).join('')}` : ''}</div></div>`;
    const inp = $('#pq'); inp.oninput = () => { q = inp.value; const pos = inp.selectionStart; draw(); const n = $('#pq'); n.focus(); n.setSelectionRange(pos, pos); };
    $('#modal .modal').onclick = e => {
      if (e.target.classList.contains('modal') || e.target.closest('[data-close]')) { $('#modal').innerHTML = ''; render(); return; }
      const b = e.target.closest('[data-pick]'); if (!b) return;
      const arr = getP(State.j.d, path) || []; const ex = arr.find(m => m.c === b.dataset.pick);
      if (ex) ex.n = (ex.n || 1) + 1; else arr.push({ c: b.dataset.pick, n: 1 });
      setP(State.j.d, path, arr); State.j.dirty = true; draw();
    };
  };
  draw();
}

/* ---------- eventos de la mesa del juez ---------- */
function jMark(){ State.j.dirty = true; render(); }
document.addEventListener('click', async e => {
  const t = e.target;
  const ec = t.closest('[data-ec]'); if (ec && State.ej && State.ej.d) { e.preventDefault(); const v = Math.max(0, (+getP(State.ej.d, ec.dataset.ec) || 0) + (+ec.dataset.d)); setP(State.ej.d, ec.dataset.ec, v); State.ej.dirty = true; escDraftSet(); return render(); }
  const eco = t.closest('[data-ecol]'); if (eco && State.ej) { e.preventDefault(); State.ej.col = eco.dataset.ecol; return render(); }
  const ejt = t.closest('[data-ejteam]'); if (ejt && State.ej) { e.preventDefault(); if (State.ej.dirty && !(await ask('Cambios sin publicar', 'Tienes cambios sin publicar en esta hoja. ¿Descartarlos?', 'Descartar', true))) return; State.ej.tid = ejt.dataset.ejteam; State.ej.d = null; State.ej.dirty = false; return render(); }
  const jt = t.closest('[data-jt]'); if (jt) { e.preventDefault(); setP(State.j.d, jt.dataset.jt, !getP(State.j.d, jt.dataset.jt)); return jMark(); }
  const ja = t.closest('[data-ja]'); if (ja) { e.preventDefault(); const a = getP(State.j.d, ja.dataset.ja) || []; const v = ja.dataset.v; setP(State.j.d, ja.dataset.ja, a.includes(v) ? a.filter(x => x !== v) : [...a, v]); return jMark(); }
  const js = t.closest('[data-js]'); if (js) { e.preventDefault(); const v = (+getP(State.j.d, js.dataset.js) || 0) + (+js.dataset.d); setP(State.j.d, js.dataset.js, Math.max(+js.dataset.min, Math.min(+js.dataset.max, v))); return jMark(); }
  const jr = t.closest('[data-jrm]'); if (jr) { e.preventDefault(); const a = getP(State.j.d, jr.dataset.jrm) || []; const i = +jr.dataset.i; if (a[i].n > 1) a[i].n--; else a.splice(i, 1); setP(State.j.d, jr.dataset.jrm, a); return jMark(); }
  const jd = t.closest('[data-jadd]'); if (jd) { e.preventDefault(); return infPicker(jd.dataset.jadd, jd.dataset.key); }
  const ji = t.closest('[data-jaddint]'); if (ji) { e.preventDefault(); const d = State.j.d; const hasCab = RULES.calc('terna', d).rows.some(r => r.ok && r.tipo === 'cabeza'); d.intentos.push({ l: d.intentos.length % 3, tipo: hasCab ? 'pial' : 'cabeza', res: '', fl: [], rm: [], m: [], dq: false }); return jMark(); }

(async function boot(){
  $('#view').innerHTML = '<div class="empty">Cargando…</div>';
  const authHash = new URLSearchParams(location.hash.slice(1));   // enlace del correo: #access_token=…&type=recovery o #error=…
  if (authHash.get('type') === 'recovery') State.recovery = true;
  const hasKeys = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
  const mode = CONFIG.MODE === 'demo' || CONFIG.MODE === 'real' ? CONFIG.MODE : (hasKeys ? 'real' : 'demo');
  DB.backend = mode === 'real' ? Remote : Local;
  try { if (mode === 'real' && !hasKeys) throw new Error('Faltan SUPABASE_URL y SUPABASE_ANON_KEY'); await DB.backend.init(); }
  catch (e) {
    if (mode === 'real') { $('#view').innerHTML = `<div class="empty">No se pudo conectar al servidor.<div class="small mut mt">${esc(e.message || e)}</div><button class="btn sm mt" onclick="location.reload()">Reintentar</button></div>`; return; }
    throw e;
  }
  try { State.user = await DB.backend.restore(); } catch (e) { State.user = null; }
  if (authHash.has('access_token') || authHash.has('error')) history.replaceState(null, '', location.pathname + location.search + '#cuenta');
  if (authHash.has('error')) setTimeout(() => toast(authHash.get('error_code') === 'otp_expired' ? 'El enlace ya expiró o ya se usó. Pide uno nuevo.' : (authHash.get('error_description') || 'Enlace inválido'), 'err'), 300);
  if (TCG) document.title = 'CharreríaTCG';
  parseRoute(); render();
})();
